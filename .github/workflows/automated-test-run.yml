name: automated test run

on:
  workflow_dispatch:
    inputs:
      automation_run_id:
        description: Testify automation run UUID
        required: true
        type: string
      environment:
        description: Testify target environment
        required: true
        type: environment

permissions:
  contents: read

concurrency:
  group: testify-automation-${{ inputs.automation_run_id }}
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: automation/package-lock.json

      - name: Install runner dependencies
        working-directory: automation
        run: npm ci

      - name: Install Chromium
        working-directory: automation
        run: npx playwright install --with-deps chromium

      - name: Verify runner contracts
        working-directory: automation
        run: npm test

      - name: Execute automation run
        working-directory: automation
        run: npm start
        env:
          TESTIFY_APP_URL: ${{ vars.TESTIFY_APP_URL }}
          TESTIFY_AUTOMATION_RUN_ID: ${{ inputs.automation_run_id }}
          TESTIFY_CREDENTIAL_PROFILES_JSON: ${{ secrets.TESTIFY_CREDENTIAL_PROFILES_JSON }}
          TESTIFY_RUNNER_SIGNING_SECRET: ${{ secrets.TESTIFY_RUNNER_SIGNING_SECRET }}
